<!DOCTYPE html>
<!--
  [MUDANÇA · ESTRUTURA] Antes: 1 arquivo de 1,4 MB (CSS + JS + imagens em base64 dentro do HTML).
  Agora: HTML enxuto + css/ + js/ + assets/img/ (as 67 imagens viraram arquivos, cacheáveis pelo navegador).

  IMPORTANTE — a ORDEM dos <link> e <script> abaixo importa:
    • CSS: cada arquivo sobrescreve o anterior (cascata), por isso os nomes são numerados;
    • JS: são scripts clássicos que compartilham o escopo global (o protótipo usa onclick="..."),
      então cada arquivo só pode usar o que foi declarado nos arquivos acima dele.
  Pastas JS:  config/api/services/utils = novos (backend)  ·  core = estado e navegação
              data = catálogo e imagens  ·  components = peças de UI  ·  screens = telas  ·  features = recursos
-->
